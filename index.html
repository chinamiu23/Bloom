</style></head><body><div id="root"></div><div id="dialogs"></div><div id="notifications" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.2/dist/umd/supabase.js" defer></script><script>
'use strict';
const SUPABASE_URL='https://YOUR_PROJECT.supabase.co';
const SUPABASE_PUBLIC_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
const PAGES=['Dashboard','Tasks','Habits','Study timer','Goals','Reports','Settings'];
const root=document.getElementById('root'),dialogs=document.getElementById('dialogs');
let client=null,user=null,demo=false,loaded=false,busy=false,page='Dashboard',mobile=false,authMode='login',recovering=false,identity=null,epoch=0,modal=null,previousFocus=null;
const dateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>dateStr(new Date()),shift=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return dateStr(x)};
const validDate=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||v<'2000-01-01'||v>'2100-12-31')return false;const d=new Date(v+'T12:00:00Z');return !isNaN(+d)&&d.toISOString().slice(0,10)===v};
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID(),profileDefault=()=>({display_name:'',theme:'light',focus_minutes:25,break_minutes:5});
let profile=profileDefault(),data={tasks:[],habits:[],habit_logs:[],sessions:[],goals:[]},filters={search:'',status:'all',priority:'all',date:today(),from:shift(today(),-6),to:today()};
function reset(){data={tasks:[],habits:[],habit_logs:[],sessions:[],goals:[]};profile=profileDefault();loaded=false;page='Dashboard';filters={search:'',status:'all',priority:'all',date:today(),from:shift(today(),-6),to:today()}}
const icon=(s='✦')=>`<span aria-hidden="true">${s}</span>`,brand=()=>`<a class="brand" href="#" data-action="home"><span class="flower">✿</span><span>bloom<span class="branddot">.</span><small>YOUR LITTLE GROWTH SPACE</small></span></a>`;
function notify(message,error=false){const box=document.getElementById('notifications');box.innerHTML=`<div class="toast ${error?'error-toast':''}" role="${error?'alert':'status'}">${e(message)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>box.replaceChildren(),5000)}
function safeError(err){if(err.code==='23505')return 'This check-in or active timer already exists. Refresh to see it.';if(err.code==='42501')return 'Access denied. Sign in again or check the database setup.';return err instanceof Error&&!err.code?err.message:'Could not save. Check your connection and refresh.'}
function configured(){if(SUPABASE_URL.includes('YOUR_')||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL))return false;if(SUPABASE_PUBLIC_KEY.startsWith('sb_publishable_'))return true;try{return JSON.parse(atob(SUPABASE_PUBLIC_KEY.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon'}catch{return false}}
const field=(label,name,value='',type='text',extra='')=>`<label class="field">${e(label)}<input name="${name}" type="${type}" value="${e(value)}" ${extra}></label>`;
const options=(list,current)=>list.map(v=>`<option ${v===current?'selected':''}>${e(v)}</option>`).join('');
const select=(label,name,list,value)=>`<label class="field">${e(label)}<select name="${name}">${options(list,value)}</select></label>`;
const progress=p=>`<div class="progress" role="progressbar" aria-label="Goal progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.max(0,Math.round(p)))}"><i style="width:${Math.min(100,Math.max(0,p))}%"></i></div>`;
const dateField=(label,name,v)=>field(label,name,v,'date','required min="2000-01-01" max="2100-12-31"');
const integer=(v,min=0,max=1000000)=>{const n=Number(v);if(!/^\d+$/.test(String(v))||!Number.isInteger(n)||n<min||n>max)throw Error(`Enter a whole number from ${min} to ${max}.`);return n};
function scheduled(h,d){return d>=h.start_date&&(h.schedule==='Daily'||![0,6].includes(new Date(d+'T12:00:00').getDay()))}
const checked=(h,d)=>data.habit_logs.some(x=>x.habit_id===h.id&&x.log_date===d);
function streak(h,d=today()){let count=0;let cursor=d;if(scheduled(h,cursor)&&!checked(h,cursor))cursor=shift(cursor,-1);for(;cursor>=h.start_date;cursor=shift(cursor,-1)){if(!scheduled(h,cursor))continue;if(!checked(h,cursor))break;count++}return count}
const focusSeconds=(from,to)=>data.sessions.filter(s=>s.ended_at&&s.kind==='Focus'&&s.session_date>=from&&s.session_date<=to).reduce((a,s)=>a+s.duration_seconds,0);
const duration=n=>`${Math.floor(n/60)}m ${Math.floor(n%60)}s`;
const active=()=>data.sessions.find(s=>!s.ended_at);
function remaining(s){return Math.max(0,s.target_minutes*60-Math.max(0,Math.floor((Date.now()-new Date(s.started_at).getTime())/1000)))}
function landing(){document.documentElement.dataset.theme='light';root.innerHTML=`<div class="landing"><div class="landnav">${brand()}<div class="actions"><button class="secondary" data-action="auth" data-mode="login">Log in</button><button class="primary" data-action="auth" data-mode="signup">Sign up</button></div></div><section class="landhero"><div><div class="eyebrow">SMALL STEPS. BEAUTIFUL GROWTH.</div><h1>Make space<br>for the person<br>you’re becoming.</h1><p>A gentle home for your assignments, habits and goals. Plan your day, find your focus, and let your progress bloom.</p><div class="pillgroup"><button class="primary" data-action="auth" data-mode="signup">Start growing →</button><button class="secondary" data-action="demo">Explore demo</button></div><p class="tiny">Private workspace · Your pace · A little progress every day</p></div><div class="landvisual"><div class="eyebrow">A LITTLE LOOK INSIDE · SAMPLE PREVIEW</div><div class="stat balance"><span>Today is a fresh start.</span><h2>You’ve got this ✿</h2><small>One small step is still a step.</small></div><div class="taskrow"><span class="roundcheck checked">✓</span><div class="taskbody"><strong>Study something new</strong><small>A little closer to your future self.</small></div></div><div class="hero-goal"><div class="between"><span>Build a habit</span><b>Keep going</b></div>${progress(65)}</div></div></section><div class="landfeatures">${[['✓','Plan with clarity','Keep tasks, deadlines and priorities together.'],['✿','Build your rhythm','Track daily habits without losing sight of the little wins.'],['◷','Find your focus','Study timers, learning history and progress charts.']].map(([i,h,p])=>`<div class="card">${icon(i)}<h3>${h}</h3><p class="muted">${p}</p></div>`).join('')}</div><section class="privacy"><h3>Your space is personal.</h3><p>Supabase authentication and database ownership rules protect each user’s records. No AI or analytics services receive your tasks or study notes. Demo data is kept only in memory. Session tokens are managed by Supabase; sign out on shared devices.</p>${!configured()?'<p class="readonlynote">Cloud setup is not configured yet. Explore the working demo, then follow README.md to enable accounts and cloud saving.</p>':''}</section><div class="landfooter">Bloom · Progress, with a little kindness.</div></div>`}
function authView(mode){authMode=mode;const signup=mode==='signup',reset=mode==='reset',recovery=mode==='recovery';root.innerHTML=`<div class="landing"><div class="landnav">${brand()}<button class="secondary" data-action="home">Back home</button></div><div class="card authbox"><div class="eyebrow">MAKE YOURSELF AT HOME</div><h1 style="font-size:28px">${signup?'Let’s grow together.':reset?'A fresh start.':recovery?'Choose a new password.':'Welcome back.'}</h1><form data-form="auth">${signup?field('Your name','name','','text','required maxlength="80" autocomplete="name"'):''}${!recovery?field('Email','email','','email','required autocomplete="email"'):''}${!reset?field('Password','password','','password',`required minlength="12" maxlength="128" autocomplete="${signup||recovery?'new-password':'current-password'}"`):''}<button class="primary wide" type="submit">${signup?'Create account':reset?'Send reset link':recovery?'Save password':'Log in'}</button></form><div class="pillgroup" style="margin-top:20px"><button class="textbtn" data-action="auth" data-mode="${signup?'login':'signup'}">${signup?'Already have an account?':'Create an account'}</button><button class="textbtn" data-action="auth" data-mode="reset">Forgot password?</button></div></div></div>`}
async function rows(table,owner){let all=[];for(let i=0;;i+=500){const r=await client.from('bloom_'+table).select('*').eq('user_id',owner).order(table==='profiles'?'user_id':'id').range(i,i+499);if(r.error)throw r.error;all.push(...r.data);if(r.data.length<500)return all}}
async function load(){if(!user)return false;const id=user.id,run=++epoch;loaded=false;render();try{const tables=Object.keys(data);const results=await Promise.all([...tables,'profiles'].map(t=>rows(t,id)));if(id!==user?.id||run!==epoch)return false;data=Object.fromEntries(tables.map((t,i)=>[t,results[i]]));if(!results.at(-1).length){const r=await client.from('bloom_profiles').insert({user_id:id,display_name:user.user_metadata?.display_name||''}).select();if(r.error)throw r.error;profile=r.data[0]}else profile=results.at(-1)[0];loaded=true;render();return true}catch(err){notify(safeError(err),true);root.querySelector('.content').innerHTML='<div class="error">Could not load your workspace.</div><button class="primary" data-action="reload">Retry</button>';return false}}
async function write(table,record,id){if(demo){if(table==='profiles'){profile={...profile,...record};return}if(id){const old=data[table].find(x=>x.id===id);if(!old)throw Error('Record was removed.');Object.assign(old,record)}else data[table].push({...record,id:uuid(),created_at:new Date().toISOString(),updated_at:new Date().toISOString()});return}if(!user)throw Error('Sign in first.');let q;if(table==='profiles')q=client.from('bloom_profiles').update(record).eq('user_id',user.id);else if(id){const old=data[table].find(x=>x.id===id);q=client.from('bloom_'+table).update(record).eq('user_id',user.id).eq('id',id).eq('updated_at',old.updated_at)}else q=client.from('bloom_'+table).insert({...record,user_id:user.id});const r=await q.select();if(r.error)throw r.error;if(!r.data.length)throw Error('Record changed in another tab. Refresh before editing.')}
async function remove(table,id){if(!confirm(table==='habits'?'Delete this habit and all of its check-ins?':'Delete this record? This cannot be undone.'))return;await mutate(async()=>{if(demo){data[table]=data[table].filter(x=>x.id!==id);if(table==='habits')data.habit_logs=data.habit_logs.filter(x=>x.habit_id!==id)}else{const r=await client.from('bloom_'+table).delete().eq('user_id',user.id).eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw Error('Record already removed.')}},'Record deleted')}
async function mutate(work,message='Saved successfully'){if(busy||!loaded)return;busy=true;try{await work();closeModal();if(demo)render();else if(!await load()){notify('Saved, but refresh is needed to reload your records.',true);return}notify(message)}catch(err){notify(safeError(err),true)}finally{busy=false}}
function taskRows(list){return list.length?list.map(t=>`<div class="taskrow ${t.status==='done'?'done':''}"><button class="roundcheck ${t.status==='done'?'checked':''}" data-action="task-toggle" data-id="${t.id}" aria-label="${t.status==='done'?'Reopen':'Complete'} ${e(t.title)}">${t.status==='done'?'✓':''}</button><div class="taskbody"><strong>${e(t.title)}</strong><small>${e(t.subject||'Personal')} · ${e(t.due_date)} · ${e(t.priority)}${t.status==='todo'&&t.due_date<today()?' · Overdue':''}</small>${t.notes?`<p>${e(t.notes)}</p>`:''}</div><div class="actions"><button class="iconbtn" data-action="edit" data-kind="tasks" data-id="${t.id}">Edit</button><button class="iconbtn" data-action="delete" data-table="tasks" data-id="${t.id}">Delete</button></div></div>`).join(''):'<div class="empty">No tasks here. Make room for your next small step.</div>'}
function chart(from=shift(today(),-6),to=today()){if(from>to)return '<p class="error">Start date must be before end date.</p>';let days=[];for(let d=from;d<=to;d=shift(d,1))days.push({date:d,seconds:focusSeconds(d,d)});if(days.length>31)return '<p class="muted">Select a range of 31 days or fewer to view daily bars.</p>';const max=Math.max(60,...days.map(d=>d.seconds));return `<div class="bargraph" role="img" aria-label="Daily focus time">${days.map(d=>`<div class="barcol" title="${d.date}: ${duration(d.seconds)}"><small>${Math.floor(d.seconds/60)}m</small><i style="height:${Math.max(2,d.seconds/max*150)}px"></i><small>${d.date.slice(5)}</small></div>`).join('')}</div><details class="charttable"><summary>View chart values</summary>${days.map(d=>`<div class="between"><span>${d.date}</span><b>${duration(d.seconds)}</b></div>`).join('')}</details>`}
function dashboard(){const due=data.tasks.filter(t=>t.status==='todo'&&t.due_date<=today()).sort((a,b)=>a.due_date.localeCompare(b.due_date));const habits=data.habits.filter(h=>scheduled(h,today())),done=habits.filter(h=>checked(h,today())).length;return `<div class="datebar">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}<span>A little progress is enough.</span></div><div class="stats">${[['Tasks to focus on',due.length,'balance','Due today or earlier'],['Habits completed',`${done} / ${habits.length}`,'','Scheduled for today'],['Today’s focus',duration(focusSeconds(today(),today())),'','Saved focus sessions only'],['Active goals',data.goals.filter(g=>g.progress<g.target).length,'','Your next possibilities']].map(([l,v,c,s])=>`<div class="stat ${c}"><span>${l}</span><h2>${v}</h2><small>${s}</small></div>`).join('')}</div><div class="dashboardgrid"><section class="card"><div class="cardhead pad"><div><h3>Your next little steps</h3><p>Give your attention to what matters.</p></div><button class="textbtn" data-action="nav" data-page="Tasks">All tasks →</button></div>${taskRows(due.slice(0,4))}</section><section class="card pad"><div class="cardhead"><h3>Your daily rhythm</h3><span class="flower">✿</span></div>${habits.slice(0,4).map(h=>`<div class="taskrow" style="padding:15px 0"><button class="roundcheck ${checked(h,today())?'checked':''}" data-action="habit-toggle" data-id="${h.id}" data-date="${today()}" aria-label="Check in ${e(h.name)}">${checked(h,today())?'✓':''}</button><div class="taskbody"><strong>${e(h.name)}</strong><small>${streak(h)} day streak</small></div></div>`).join('')||'<p class="muted">Start with one tiny habit.</p>'}<button class="wide textbtn" data-action="nav" data-page="Habits">Your habits →</button></section><section class="card pad"><h3>A week of growing</h3><p class="muted">Your recorded focus time, day by day.</p>${chart()}</section><section class="card pad"><h3>Find a little focus</h3><p class="muted">Set your intention. Give it ${profile.focus_minutes} minutes.</p><div class="timer-number" style="font-size:48px">${active()?'In progress':profile.focus_minutes+':00'}</div><button class="primary wide" data-action="nav" data-page="Study timer">Go to your timer →</button></section><section class="card savingspreview"><div class="cardhead"><h3>Your possibilities are growing</h3><button class="textbtn" data-action="nav" data-page="Goals">All goals →</button></div><div class="goalpreviewgrid">${data.goals.slice(0,2).map(g=>`<div><div class="between"><span>${e(g.name)}</span><b>${Math.round(g.progress/g.target*100)}%</b></div>${progress(g.progress/g.target*100)}<small>${g.progress} / ${g.target} ${e(g.unit)}</small></div>`).join('')||'<p class="muted">A goal gives your small steps a direction.</p>'}</div></section></div>`}
function tasksView(){let list=data.tasks.filter(t=>(filters.status==='all'||t.status===filters.status)&&(filters.priority==='all'||t.priority===filters.priority)&&[t.title,t.subject,t.notes].join(' ').toLowerCase().includes(filters.search.toLowerCase())).sort((a,b)=>a.due_date.localeCompare(b.due_date));return `<section class="card"><div class="filters"><input data-filter="search" placeholder="Search tasks…" aria-label="Search tasks" value="${e(filters.search)}"><select data-filter="status" aria-label="Task status">${options(['all','todo','done'],filters.status)}</select><select data-filter="priority" aria-label="Priority">${options(['all','Low','Medium','High'],filters.priority)}</select></div>${taskRows(list)}</section>`}
function habitsView(){const d=filters.date;return `<label class="field habit-date-filter">Check-in date<input data-filter="date" type="date" min="2000-01-01" max="${today()}" value="${e(d)}"></label><div class="cardsgrid habitcards">${data.habits.map(h=>`<section class="card"><div class="cardhead"><span class="flower">✿</span><div class="actions"><button class="iconbtn" data-action="edit" data-kind="habits" data-id="${h.id}">Edit</button><button class="iconbtn" data-action="delete" data-table="habits" data-id="${h.id}">Delete</button></div></div><h3>${e(h.name)}</h3><p class="muted">${e(h.schedule)} · Started ${e(h.start_date)}</p><p class="streak">${streak(h,d)} scheduled-day streak</p><p class="muted">${e(h.notes)}</p><button class="${checked(h,d)?'primary':'secondary'} wide" data-action="habit-toggle" data-id="${h.id}" data-date="${d}" ${!scheduled(h,d)?'disabled':''}>${checked(h,d)?'✓ Completed — undo':'Check in today'}</button>${!scheduled(h,d)?'<p class="forminfo">Not scheduled on this date.</p>':''}</section>`).join('')||'<div class="empty">Add a habit you want to grow.</div>'}</div><p class="footnote">Streaks count consecutive scheduled days. Weekends are skipped for weekday habits. Missing today does not erase yesterday’s streak until another scheduled day passes.</p>`}
function timerView(){const s=active();return `<section class="card pad timerpanel"><div class="eyebrow">ONE THING AT A TIME</div><h3>${s?e(s.subject):'Give yourself a little focus.'}</h3>${s?`<p class="muted">${s.kind} · ${s.target_minutes} minute plan</p><div class="timer-number" id="countdown"></div><p class="muted" id="timer-status"></p><button class="primary" data-action="finish-timer">Finish & save session</button><button class="secondary" data-action="cancel-timer">Cancel without saving</button>`:`<div class="timer-number">${profile.focus_minutes}:00</div><form data-form="timer">${field('What are you working on?','subject','','text','required maxlength="120" placeholder="e.g. JavaScript practice"')}${select('Session type','kind',['Focus','Break'],'Focus')}${field('Minutes','target_minutes',profile.focus_minutes,'number','required min="1" max="180" step="1"')}<button class="primary" type="submit">Start session →</button></form>`}<p class="footnote">Timer uses a saved start time, so refresh does not reset it. Finish records elapsed time, capped at the planned duration. No automatic background sound or verified activity tracking.</p></section><section class="card pad" style="margin-top:22px"><h3>Recent sessions</h3>${sessionRows(data.sessions.filter(s=>s.ended_at).sort((a,b)=>b.started_at.localeCompare(a.started_at)).slice(0,10))}</section>`}
function sessionRows(list){return list.length?`<div class="tablewrap"><table><thead><tr><th>Subject</th><th>Date</th><th>Type</th><th>Time</th><th>Actions</th></tr></thead><tbody>${list.map(s=>`<tr><td>${e(s.subject)}</td><td>${e(s.session_date)}</td><td>${s.kind}</td><td>${duration(s.duration_seconds)}</td><td><button class="iconbtn" data-action="delete" data-table="sessions" data-id="${s.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Your first focus session is a fresh start.</p>'}
function goalsView(){return `<div class="cardsgrid">${data.goals.map(g=>`<section class="card pad"><div class="cardhead"><span class="flower">✧</span><div class="actions"><button class="iconbtn" data-action="edit" data-kind="goals" data-id="${g.id}">Edit</button><button class="iconbtn" data-action="delete" data-table="goals" data-id="${g.id}">Delete</button></div></div><h3>${e(g.name)}</h3><h2>${g.progress} <small>of ${g.target} ${e(g.unit)}</small></h2>${progress(g.progress/g.target*100)}<p class="muted">Target ${e(g.target_date)} · ${Math.round(g.progress/g.target*100)}%</p><p class="muted">${e(g.notes)}</p><div class="goalbuttons"><button class="secondary" data-action="goal-minus" data-id="${g.id}" ${g.progress===0?'disabled':''}>−1</button><button class="primary" data-action="goal-plus" data-id="${g.id}" ${g.progress>=1000000?'disabled':''}>+1 step</button></div></section>`).join('')||'<div class="empty">Create a goal that feels meaningful to you.</div>'}</div><p class="footnote">Goal progress is entered manually. It is separate from tasks, habits and focus time; edit a goal for larger changes.</p>`}
function reportsView(){const from=filters.from,to=filters.to,completed=data.tasks.filter(t=>t.status==='done'&&t.completed_date>=from&&t.completed_date<=to).length;let opportunities=0,checks=0;for(let d=from;d<=to;d=shift(d,1))for(const h of data.habits)if(scheduled(h,d)){opportunities++;if(checked(h,d))checks++}return `<div class="filters rangebar"><label>From<input data-filter="from" type="date" value="${from}" min="2000-01-01" max="${today()}"></label><label>To<input data-filter="to" type="date" value="${to}" min="${from}" max="${today()}"></label><button class="secondary" data-action="csv">Export study CSV</button></div><div class="stats compact">${[['Focus time',duration(focusSeconds(from,to))],['Tasks completed',completed],['Habit consistency',opportunities?Math.round(checks/opportunities*100)+'%':'No scheduled days']].map(([l,v])=>`<div class="stat"><span>${l}</span><h2>${v}</h2></div>`).join('')}</div><div class="twocol"><section class="card pad"><h3>Daily focus time</h3>${chart(from,to)}</section><section class="card pad"><h3>A little perspective</h3><p class="muted">${checks} check-ins across ${opportunities} scheduled habit opportunities in this range.</p><p class="muted">This week: ${duration(focusSeconds(shift(today(),-6),today()))} of saved focus time.</p><p class="muted">This month: ${duration(focusSeconds(today().slice(0,7)+'-01',today()))}.</p><p class="forminfo">Insights use saved records only. Break sessions are excluded. Editing a habit’s schedule changes its historical consistency denominator.</p></section></div><section class="card pad" style="margin-top:22px"><h3>Study history in this range</h3>${sessionRows(data.sessions.filter(s=>s.ended_at&&s.session_date>=from&&s.session_date<=to))}</section>`}
function settingsView(){return `<div class="twocol"><section class="card pad"><h3>Make Bloom feel like you.</h3><form data-form="settings">${field('Display name','display_name',profile.display_name,'text','maxlength="80"')}${field('Default focus minutes','focus_minutes',profile.focus_minutes,'number','required min="1" max="180" step="1"')}${field('Default break minutes','break_minutes',profile.break_minutes,'number','required min="1" max="60" step="1"')}${select('Color theme','theme',['light','dark'],profile.theme)}<button class="primary" type="submit">Save preferences</button></form></section><section class="card pad"><h3>Your data belongs to you.</h3><p class="muted">${demo?'Demo records are in memory only. They disappear when you leave.':'Your workspace is saved in Supabase with database-enforced ownership.'}</p><div class="settingbuttons"><button class="secondary" data-action="backup">Download full JSON export</button><button class="secondary" data-action="csv-all">Export study CSV</button><button class="secondary" data-action="reload">Refresh workspace</button><button class="secondary" data-action="logout">${demo?'Leave demo':'Sign out'}</button>${!demo?'<button class="dangerbtn" data-action="delete-account">Delete account and all records</button>':''}</div><p class="forminfo">JSON is a private archive of your records. Automatic restore is not included. Keep exports out of your public GitHub repository.</p></section></div>`}
function render(){if(recovering){authView('recovery');return}if(!user&&!demo){landing();return}document.documentElement.dataset.theme=profile.theme;const desc={Dashboard:'A little intention. A little progress. A little more you.',Tasks:'Make space for what matters.',Habits:'Let small things become your rhythm.','Study timer':'One focused moment at a time.',Goals:'Your possibilities are growing.',Reports:'See how far your small steps have taken you.',Settings:'Your space, your pace.'};root.innerHTML=`<div class="app"><aside class="sidebar ${mobile?'open':''}">${brand()}<div class="navlabel">YOUR GROWTH SPACE</div><nav>${PAGES.map((p,i)=>`<button data-action="nav" data-page="${p}" class="${p===page?'active':''}">${icon(['▦','✓','✿','◷','✧','▥','⚙'][i])}${p}</button>`).join('')}</nav><div class="sidebottom"><div class="sidehint"><span>Progress, with kindness.</span><p>Your own pace is a good pace.</p></div><div class="profile"><span class="avatar">${e((profile.display_name||'Y').slice(0,1).toUpperCase())}</span><div><strong>${e(profile.display_name||'My workspace')}</strong><small>${demo?'Demo · not saved':'Private account'}</small></div></div></div></aside><main><header class="topbar"><button class="menubtn iconbtn" data-action="menu" aria-label="Toggle navigation">☰</button><span class="breadcrumb">My homebase › <strong>${page}</strong></span><span class="muted tiny">${busy?'Saving…':demo?'Demo mode':loaded?'Cloud connected':'Loading…'}</span></header><div class="content"><div class="heading"><div><div class="eyebrow">SMALL STEPS. BEAUTIFUL GROWTH.</div><h1>${page==='Dashboard'?'Today, let yourself bloom.':page}</h1><p>${desc[page]}</p></div>${loaded&&['Dashboard','Tasks','Habits','Goals'].includes(page)?`<button class="primary" data-action="add" data-kind="${page==='Habits'?'habits':page==='Goals'?'goals':'tasks'}">+ Add ${page==='Habits'?'habit':page==='Goals'?'goal':'task'}</button>`:''}</div>${demo?'<div class="demobar">Sample workspace · demo data is not saved. <button class="textbtn" data-action="logout">Leave demo</button></div>':''}${!loaded?'<div class="loading">Loading your private space…</div>':({Dashboard:dashboard,Tasks:tasksView,Habits:habitsView,'Study timer':timerView,Goals:goalsView,Reports:reportsView,Settings:settingsView}[page])()}<footer><span>Bloom · Your pace is a good pace.</span><span>Private by design.</span></footer></div></main><nav class="bottomnav">${['Dashboard','Tasks','Habits','Study timer'].map((p,i)=>`<button data-action="nav" data-page="${p}" class="${p===page?'active':''}">${icon(['▦','✓','✿','◷'][i])}${p==='Study timer'?'Timer':p}</button>`).join('')}<button data-action="menu">☰ More</button></nav></div>`;tick()}
function tick(){const s=active(),el=document.getElementById('countdown');if(s&&el){const n=remaining(s);el.textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;document.getElementById('timer-status').textContent=n?'A little focus, a little growth.':'Time is up. Finish to save this session.'}}
setInterval(tick,1000);
function closeModal(){modal=null;dialogs.replaceChildren();previousFocus?.focus()}
function openModal(kind,record=null){if(!loaded)return;modal={kind,record};previousFocus=document.activeElement;const r=record||{};let body='';if(kind==='tasks')body=`${field('Task / assignment title','title',r.title||'','text','required maxlength="160"')}${field('Subject','subject',r.subject||'','text','maxlength="80"')}${dateField('Due date','due_date',r.due_date||today())}${select('Priority','priority',['Low','Medium','High'],r.priority||'Medium')}`;if(kind==='habits')body=`${field('Habit name','name',r.name||'','text','required maxlength="120"')}${select('Schedule','schedule',['Daily','Weekdays'],r.schedule||'Daily')}${dateField('Start date','start_date',r.start_date||today())}`;if(kind==='goals')body=`${field('Goal name','name',r.name||'','text','required maxlength="120"')}${field('Target','target',r.target||10,'number','required min="1" max="1000000" step="1"')}${field('Progress so far','progress',r.progress||0,'number','required min="0" max="1000000" step="1"')}${field('Unit','unit',r.unit||'steps','text','required maxlength="40" placeholder="e.g. lessons, books"')}${dateField('Target date','target_date',r.target_date||shift(today(),90))}`;if(kind==='delete-account')body=`<p class="error">Permanently deletes your login and all Bloom records. Export them first.</p>${field('Confirm password','password','','password','required autocomplete="current-password"')}<label class="check"><input name="confirmed" type="checkbox" required>I understand this cannot be undone.</label>`;else body+=`<label class="field">Notes (optional)<textarea name="notes" rows="3" maxlength="1000">${e(r.notes||'')}</textarea></label>`;dialogs.innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="cardhead"><h3 id="dialog-title">${kind==='delete-account'?'Delete account':record?'Edit '+kind:'Add '+kind}</h3><button class="iconbtn" data-action="close" aria-label="Close dialog">✕</button></div><form data-form="${kind}">${body}<div class="modalfooter"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="primary">${kind==='delete-account'?'Permanently delete':'Save'}</button></div></form></section></div>`;dialogs.querySelector('input,select')?.focus()}
async function authSubmit(form){if(!client||!configured())throw Error('Configure Supabase before accounts can be used. The demo is available now.');const f=new FormData(form),email=String(f.get('email')||'').trim(),password=String(f.get('password')||''),redirect=location.origin+location.pathname;busy=true;try{let r;if(authMode==='signup'){r=await client.auth.signUp({email,password,options:{data:{display_name:String(f.get('name')||'')},emailRedirectTo:redirect}});if(r.error)throw Error('Registration failed. Check your email, password requirements and email configuration.');if(!r.data.session){authView('login');notify('Check your email to verify your account.')}}else if(authMode==='reset'){r=await client.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(r.error)throw Error('Could not send reset email. Check the connection and email setup.');notify('If the account exists, a reset link will be sent.')}else if(authMode==='recovery'){r=await client.auth.updateUser({password});if(r.error)throw Error('Reset link is expired or the password was rejected. Request a new link.');recovering=false;if(user)await load();else authView('login');notify('Password updated.')}else{r=await client.auth.signInWithPassword({email,password});if(r.error)throw Error('Login failed. Check your email/password and verify your email.')}}finally{busy=false}}
async function submit(form){const f=new FormData(form),kind=form.dataset.form,str=k=>String(f.get(k)||'').trim(),id=modal?.record?.id;try{if(kind==='auth'){await authSubmit(form);return}if(busy||!loaded)return;if(kind==='tasks'){if(!validDate(str('due_date')))throw Error('Choose a valid due date.');await mutate(()=>write('tasks',{title:str('title'),subject:str('subject'),due_date:str('due_date'),priority:str('priority'),status:modal.record?.status||'todo',completed_date:modal.record?.completed_date||null,notes:str('notes')},id))}else if(kind==='habits'){if(!validDate(str('start_date')))throw Error('Choose a valid start date.');await mutate(()=>write('habits',{name:str('name'),schedule:str('schedule'),start_date:str('start_date'),notes:str('notes')},id))}else if(kind==='goals'){if(!validDate(str('target_date')))throw Error('Choose a valid target date.');await mutate(()=>write('goals',{name:str('name'),target:integer(str('target'),1),progress:integer(str('progress')),unit:str('unit'),target_date:str('target_date'),notes:str('notes')},id))}else if(kind==='settings'){await mutate(()=>write('profiles',{display_name:str('display_name'),focus_minutes:integer(str('focus_minutes'),1,180),break_minutes:integer(str('break_minutes'),1,60),theme:str('theme')}),'Preferences saved')}else if(kind==='timer'){if(active())throw Error('Finish or cancel your active session first.');const target=integer(str('target_minutes'),1,180),payload={subject:str('subject'),kind:str('kind'),target_minutes:target,session_date:today(),ended_at:null,duration_seconds:0};if(demo)payload.started_at=new Date().toISOString();await mutate(()=>write('sessions',payload),'Session started')}else if(kind==='delete-account'){if(demo||!f.has('confirmed'))return;busy=true;try{const r=await client.auth.signInWithPassword({email:user.email,password:String(f.get('password')||'')});if(r.error)throw Error('Password verification failed.');const result=await client.rpc('bloom_delete_account');if(result.error)throw result.error;await client.auth.signOut();user=null;reset();closeModal();landing();notify('Account and Bloom records deleted.')}finally{busy=false}}}catch(err){notify(safeError(err),true)}}
async function toggleHabit(id,d){if(!validDate(d)||d>today())throw Error('Select today or a past date.');const h=data.habits.find(h=>h.id===id);if(!h||!scheduled(h,d))throw Error('Habit is not scheduled on this date.');await mutate(async()=>{const log=data.habit_logs.find(l=>l.habit_id===id&&l.log_date===d);if(log){if(demo)data.habit_logs=data.habit_logs.filter(l=>l.id!==log.id);else{const r=await client.from('bloom_habit_logs').delete().eq('user_id',user.id).eq('id',log.id);if(r.error)throw r.error}}else await write('habit_logs',{habit_id:id,log_date:d})},checked(h,d)?'Check-in removed':'A little win recorded ✿')}
function csvText(list){const rows=[['Date','Subject','Type','Duration seconds','Target minutes'],...list.map(s=>[s.session_date,s.subject,s.kind,s.duration_seconds,s.target_minutes])];return '\ufeff'+rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[\s\u0000-\u001f]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n')}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function action(el){const a=el.dataset.action;if(busy&&a!=='close')return;if(a==='home'){if(user||demo){page='Dashboard';render()}else landing()}else if(a==='auth')authView(el.dataset.mode);else if(a==='demo')sample();else if(a==='nav'){page=el.dataset.page;mobile=false;render()}else if(a==='menu'){mobile=!mobile;render()}else if(a==='add')openModal(el.dataset.kind);else if(a==='close')closeModal();else if(a==='edit'){const r=data[el.dataset.kind].find(x=>x.id===el.dataset.id);if(r)openModal(el.dataset.kind,r)}else if(a==='delete')await remove(el.dataset.table,el.dataset.id);else if(a==='task-toggle'){const t=data.tasks.find(t=>t.id===el.dataset.id);if(t)await mutate(()=>write('tasks',{status:t.status==='done'?'todo':'done',completed_date:t.status==='done'?null:today()},t.id),'Task updated')}else if(a==='habit-toggle')await toggleHabit(el.dataset.id,el.dataset.date);else if(a==='goal-plus'||a==='goal-minus'){const g=data.goals.find(g=>g.id===el.dataset.id);if(g)await mutate(()=>write('goals',{progress:Math.min(1000000,Math.max(0,g.progress+(a==='goal-plus'?1:-1)))},g.id),'Progress updated')}else if(a==='finish-timer'){const s=active();if(!s)return;await mutate(async()=>{if(demo){s.ended_at=new Date().toISOString();s.duration_seconds=Math.min(s.target_minutes*60,Math.max(0,Math.floor((Date.now()-new Date(s.started_at).getTime())/1000)))}else{const r=await client.rpc('bloom_finish_session',{session_id:s.id});if(r.error)throw r.error}},'Session saved')}else if(a==='cancel-timer'){const s=active();if(s)await remove('sessions',s.id)}else if(a==='reload'){if(demo)render();else await load()}else if(a==='logout'){if(!demo){const r=await client.auth.signOut();if(r.error)throw r.error}demo=false;user=null;identity=null;++epoch;reset();closeModal();landing()}else if(a==='csv'||a==='csv-all'){const list=data.sessions.filter(s=>s.ended_at&&(a==='csv-all'||s.session_date>=filters.from&&s.session_date<=filters.to));download('bloom-study.csv',csvText(list),'text/csv;charset=utf-8');notify('CSV exported')}else if(a==='backup'){download('bloom-export.json',JSON.stringify({format:'bloom-v1',exported_at:new Date().toISOString(),profile,...data},null,2),'application/json');notify('Full export downloaded')}else if(a==='delete-account')openModal('delete-account')}
function sample(){reset();demo=true;user=null;loaded=true;profile.display_name='Your growing space';data.tasks=[{id:uuid(),title:'Practice JavaScript functions',subject:'Programming',due_date:today(),priority:'High',status:'todo',completed_date:null,notes:'One small lesson at a time.'},{id:uuid(),title:'Read a chapter',subject:'Business class',due_date:shift(today(),2),priority:'Medium',status:'todo',completed_date:null,notes:''},{id:uuid(),title:'Plan the week',subject:'Personal',due_date:today(),priority:'Low',status:'done',completed_date:today(),notes:''}];const hid=uuid();data.habits=[{id:hid,name:'Learn something new',schedule:'Daily',start_date:shift(today(),-10),notes:'Even ten minutes counts.'},{id:uuid(),name:'Move my body',schedule:'Weekdays',start_date:shift(today(),-10),notes:''}];for(let i=1;i<=5;i++)data.habit_logs.push({id:uuid(),habit_id:hid,log_date:shift(today(),-i)});for(let i=0;i<7;i++)data.sessions.push({id:uuid(),subject:'JavaScript practice',kind:'Focus',target_minutes:i===5?30:25,started_at:shift(today(),-i)+'T10:00:00Z',ended_at:new Date(new Date(shift(today(),-i)+'T10:00:00Z').getTime()+[1500,1200,900,0,1500,1800,600][i]*1000).toISOString(),duration_seconds:[1500,1200,900,0,1500,1800,600][i],session_date:shift(today(),-i)});data.goals=[{id:uuid(),name:'Finish my JavaScript course',target:20,progress:7,unit:'lessons',target_date:shift(today(),60),notes:'Keep showing up.'}];render()}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.preventDefault();action(el).catch(err=>notify(safeError(err),true))}else if(event.target.classList.contains('overlay'))closeModal()});
document.addEventListener('submit',event=>{if(event.target.dataset.form){event.preventDefault();submit(event.target)}});
document.addEventListener('change',event=>{const el=event.target;if(el.name==='kind'&&el.closest('[data-form="timer"]'))el.closest('form').querySelector('[name="target_minutes"]').value=el.value==='Break'?profile.break_minutes:profile.focus_minutes;if(el.dataset.filter){const k=el.dataset.filter;if(['date','from','to'].includes(k)&&(!validDate(el.value)||el.value>today())){notify('Choose a valid date today or earlier.',true);return}const next={...filters,[k]:el.value};if(next.from>next.to){notify('Start date must be before end date.',true);return}filters=next;render()}});
let searchTimer;document.addEventListener('input',event=>{if(event.target.dataset.filter==='search'){filters.search=event.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const el=root.querySelector('[data-filter="search"]');el?.focus();el?.setSelectionRange(filters.search.length,filters.search.length)},250)}});
document.addEventListener('keydown',event=>{if(!modal)return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const els=[...dialogs.querySelectorAll('button:not(:disabled),input,select,textarea')],first=els[0],last=els.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}});
async function initialize(){landing();if(!configured())return;if(!window.supabase){notify('Sign-in library failed to load. Refresh and check your connection.',true);return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;user=session?.user||null;setTimeout(()=>authView('recovery'),0);return}const id=session?.user?.id||null;if(!id){identity=null;user=null;demo=false;++epoch;reset();setTimeout(()=>{closeModal();landing()},0);return}user=session.user;if(id!==identity){identity=id;demo=false;reset();setTimeout(()=>load(),0)}});const {data:r,error}=await client.auth.getSession();if(error){notify('Session could not be restored. Sign in again.',true);return}if(r.session&&!recovering&&r.session.user.id!==identity){user=r.session.user;identity=user.id;reset();await load()}}
window.addEventListener('DOMContentLoaded',()=>initialize().catch(()=>notify('Could not initialize accounts. Check the Supabase setup.',true)));
</script></body></html>
